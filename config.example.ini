; 复制为 config.ini，或运行 python grab.py --setup 使用向导。
[oracle]
user =
tenancy =
fingerprint =
key_file =
region =

[instance]
name = oci-a1
ocpus = 2
memory_gb = 12
boot_volume_gb = 50
; 可用区留空时使用区域内首个；向导可按编号选择。
availability_domain =
; 推荐填写现有公网子网 OCID；仅支持根 compartment。
subnet_id =
; subnet_id 留空时，可通过下面两个名称查找现有网络。
vcn_name =
subnet_name =
; 留空自动选择兼容 A1 的 Oracle Linux 9 官方平台镜像。
image_id =
ssh_public_key_file =

[retry]
; 支持小数，例如 2.5 表示 2 分 30 秒。范围 1–60 分钟。
interval_minutes = 2
; 0=一直运行到成功或手动停止；非零时至少 1 分钟。
max_minutes = 0
jitter_seconds = 30
max_backoff_seconds = 900
check_capacity_first = false
